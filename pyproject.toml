[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcb-recruiting-agent"
version = "0.1.0"
description = "AI-агент для подбора резюме под вакансию (HCB)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10,<4.0",
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "streamlit>=1.36",
    "imap-tools>=1.6",
    "tenacity>=8.2",
    "pdfplumber>=0.11",
    "mammoth>=1.8",
    "openai>=1.50",
    "langdetect>=1.0.9",
    "fastembed>=0.4",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Research notebook (notebooks/methods_comparison.ipynb) — БЛОК 8 хвосты.
# Не входит в production docker image. Установка: `pip install -e ".[research]"`.
research = [
    "rank-bm25>=0.2.2",
    "spacy>=3.7,<4.0",
    "yake>=0.4.8",
    "rake-nltk>=1.0.6",
    "nltk>=3.8",
    "matplotlib>=3.8",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# scripts/ — one-off builders с большими string-литералами (markdown/code blobs
# для notebook). Line-length-проверка тут шумит без пользы.
"scripts/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/schemas.py", "src/parsing", "src/matching"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langdetect", "langdetect.*",
    "pdfplumber", "pdfplumber.*",
    "mammoth", "mammoth.*",
    "openai", "openai.*",
    "tenacity", "tenacity.*",
    "fastembed", "fastembed.*",
    "qdrant_client", "qdrant_client.*",
    "numpy", "numpy.*",
    "sklearn", "sklearn.*",
    "rapidfuzz", "rapidfuzz.*",
    "apscheduler", "apscheduler.*",
    "imap_tools", "imap_tools.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: e2e тесты против поднятого Docker-стека (skip по умолчанию)",
]
addopts = "-m 'not integration'"
