services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hcb
      POSTGRES_PASSWORD: hcb
      POSTGRES_DB: hcb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcb -d hcb"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hcb:hcb@postgres:5432/hcb
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - resumes_storage:/app/storage/resumes
      - ./storage/inbox:/app/storage/inbox
      # Seed-вакансии для job_seeder в lifespan. RO чтобы код не мог затереть seed.
      - ./jobs:/app/jobs:ro
      # Golden labels для eval-runner. RO чтобы прогон не мог их случайно перезаписать.
      - ./tests:/app/tests:ro
      # Markdown-отчёты eval-runner пишет на хост напрямую (наружу).
      - ./reports:/app/reports
      # fastembed кэширует ONNX-модели в ~/.cache/fastembed (~2 GB e5-large).
      # Без named volume модель качается заново на каждом recreate api.
      - models_cache:/home/hcb/.cache
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    # Streamlit-сервису секреты не нужны — он только рендерит и ходит в api по HTTP.
    # Передаём только то, что реально используется.
    environment:
      APP_VERSION: 0.1.0
      API_URL: http://api:8000
    command: ["streamlit", "run", "src/ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  qdrant_data:
  resumes_storage:
  models_cache:
